name: Pigu direct publish 359

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pigu-direct-publish-359.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-e3c4-8243-8c0f-26f775e5e547/raw?se=2026-10-01T10%3A06%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=fcd843d5-b9aa-583d-bae4-8f1bbd597850&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A14%3A20Z&ske=2026-10-02T06%3A14%3A20Z&sks=b&skv=2026-02-06&sig=f2DjebPIg9HcEGmXCoBF7394Bfpi%2B5ghm1eAqRRf4Nk%3D"
    steps:
      - name: Checkout public feed
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated private Pigu artifact
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/pigu359.zip
          unzip -p /tmp/pigu359.zip products.xml > /tmp/products.xml
          test -s /tmp/products.xml

      - name: Validate 359 products
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/products.xml').getroot()
          products=root.findall('product')
          print('products',len(products))
          if len(products) != 359:
              raise SystemExit(f'Expected 359 products, got {len(products)}')
          bad=[]
          for idx, product in enumerate(products,1):
              mod=product.find('./colours/colour/modifications/modification')
              if mod is None:
                  bad.append((idx,'missing modification')); continue
              def txt(tag): return (mod.findtext(tag) or '').strip()
              try: weight=float(txt('weight'))
              except Exception: weight=0
              ean=(mod.findtext('./attributes/barcodes/barcode') or '').strip()
              images=product.findall('./colours/colour/images/image/url')
              if weight <= 0 or txt('length') != '0.5' or txt('width') != '0.3' or txt('height') != '0.15' or not ean or len(images) < 2:
                  bad.append((idx,ean))
          if bad:
              raise SystemExit(f'{len(bad)} products failed validation; sample={bad[:10]}')
          print('validated',len(products))
          PY

      - name: Publish both Pigu aliases
        run: |
          set -euo pipefail
          mkdir -p pigu
          cp /tmp/products.xml pigu/products.xml
          cp /tmp/products.xml pigu/feed.xml
          rm -f .pigu-write-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pigu/products.xml pigu/feed.xml
          git add -u .pigu-write-probe 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Public feed already current"
            exit 0
          fi
          git commit -m "Publish 359 validated Pigu products"
          git push origin HEAD:main
