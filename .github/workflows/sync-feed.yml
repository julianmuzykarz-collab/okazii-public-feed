name: Sync Okazii public feed

on:
  push:
    paths:
      - '.github/workflows/sync-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v5

      - name: Download and normalize current feed from private repository
        env:
          GH_TOKEN: ${{ secrets.OKAZII_FEED_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/julianmuzykarz-collab/sellasist-okazii-feed/contents/okazii.xml?ref=main" \
            -o okazii.xml

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          p = Path('okazii.xml')
          if not p.exists() or p.stat().st_size < 1000000:
              raise SystemExit('Feed download failed or file is too small')

          tree = ET.parse(p)
          root = tree.getroot()

          for elem in root.iter():
              if isinstance(elem.tag, str):
                  elem.tag = elem.tag.upper()

          if root.tag != 'OKAZII':
              raise SystemExit(f'Unexpected root tag after normalization: {root.tag}')

          auctions = root.findall('AUCTION')
          if not auctions:
              raise SystemExit('No AUCTION elements found')

          removed_zero_stock = 0
          for auction in list(auctions):
              amount_node = auction.find('AMOUNT')
              raw_amount = (amount_node.text or '').strip() if amount_node is not None else ''
              try:
                  amount = Decimal(raw_amount.replace(',', '.'))
              except (InvalidOperation, AttributeError):
                  raise SystemExit(f'Invalid AMOUNT value: {raw_amount!r}')
              if amount <= 0:
                  root.remove(auction)
                  removed_zero_stock += 1

          auctions = root.findall('AUCTION')
          if not auctions:
              raise SystemExit('No positive-stock AUCTION elements remain')

          required = ('UNIQUEID', 'TITLE', 'CATEGORY', 'DESCRIPTION', 'CURRENCY', 'PRICE', 'AMOUNT')
          seen_unique_ids = set()
          for idx, auction in enumerate(auctions, 1):
              missing = [tag for tag in required if auction.find(tag) is None]
              photos = auction.find('PHOTOS')
              if photos is None or photos.find('URL') is None:
                  missing.append('PHOTOS/URL')
              if missing:
                  raise SystemExit(f'AUCTION #{idx} missing required tags: {", ".join(missing)}')

              uid = (auction.findtext('UNIQUEID') or '').strip()
              if not uid:
                  raise SystemExit(f'AUCTION #{idx} has empty UNIQUEID')
              if uid in seen_unique_ids:
                  raise SystemExit(f'Duplicate UNIQUEID in feed: {uid}')
              seen_unique_ids.add(uid)

              raw_amount = (auction.findtext('AMOUNT') or '').strip()
              try:
                  amount = Decimal(raw_amount.replace(',', '.'))
              except InvalidOperation:
                  raise SystemExit(f'AUCTION #{idx} has invalid AMOUNT: {raw_amount!r}')
              if amount <= 0:
                  raise SystemExit(f'AUCTION #{idx} still has non-positive AMOUNT: {raw_amount!r}')

          try:
              ET.indent(tree, space='  ')
          except AttributeError:
              pass
          tree.write(p, encoding='utf-8', xml_declaration=True)
          ET.parse(p)
          print(
              f'validated_auctions={len(auctions)} '
              f'removed_zero_stock={removed_zero_stock} '
              f'size_bytes={p.stat().st_size}'
          )
          PY

      - name: Commit feed if changed
        run: |
          set -euo pipefail
          git config user.name "okazii-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add okazii.xml
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Update Okazii feed"
            git push
          fi

      - name: Purge jsDelivr branch cache
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://purge.jsdelivr.net/gh/julianmuzykarz-collab/okazii-public-feed@main/okazii.xml"
          echo
