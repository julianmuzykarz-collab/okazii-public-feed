name: Sync Okazii public feed

on:
  push:
    paths:
      - '.github/workflows/sync-feed.yml'
      - 'price-drop-approvals.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: okazii-public-feed-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SELLASIST_ACCOUNT: ${{ secrets.SELLASIST_ACCOUNT }}
      SELLASIST_API_KEY: ${{ secrets.SELLASIST_API_KEY }}
      OKAZII_MAX_AMOUNT: "100"
      OKAZII_PRICE_MULTIPLIER: "1.45"
      OKAZII_PRICE_ADD_RON: "0"
      STOCK_BUFFER: "0"
      MIN_MATCH_RATE: "0.95"
      MAX_PRICE_DROP_PCT: "15"
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v5

      - name: Preserve currently published feed
        run: |
          set -euo pipefail
          test -s okazii.xml
          cp okazii.xml previous_public_okazii.xml

      - name: Download canonical feed and Sellasist sync logic
        env:
          GH_TOKEN: ${{ secrets.OKAZII_FEED_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scripts

          download_private() {
            src="$1"
            dst="$2"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/julianmuzykarz-collab/sellasist-okazii-feed/contents/${src}?ref=main" \
              -o "${dst}"
          }

          download_private "okazii.xml" "okazii.xml"
          download_private "mapping.json" "mapping.json"
          download_private "scripts/update_feed.py" "scripts/update_feed.py"

          test -s okazii.xml
          test -s mapping.json
          test -s scripts/update_feed.py

      - name: Normalize Sellasist account URL
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ.get('SELLASIST_ACCOUNT', '').strip()
          if not raw:
              raise SystemExit('SELLASIST_ACCOUNT is empty')

          candidate = raw if '://' in raw else 'https://' + raw
          parsed = urlparse(candidate)
          host = (parsed.hostname or '').strip().strip('.')
          if not host:
              raise SystemExit('SELLASIST_ACCOUNT does not contain a valid host/account')

          if '.' not in host:
              host = host + '.sellasist.pl'

          base = f'https://{host}/api/v1'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('SELLASIST_BASE_URL=' + base + '\n')
          print('Sellasist API base normalized without exposing secret value.')
          PY

      - name: Refresh live prices and stock from Sellasist when configured
        run: |
          set -euo pipefail
          if [ -z "${SELLASIST_ACCOUNT:-}" ] || [ -z "${SELLASIST_API_KEY:-}" ]; then
            echo "SELLASIST_ACCOUNT / SELLASIST_API_KEY are not configured in this public repository yet."
            echo "Skipping live refresh and publishing the latest canonical private feed only."
            exit 0
          fi

          python scripts/update_feed.py
          echo "Live Sellasist price and stock refresh completed."

      - name: Normalize and validate Okazii public feed
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          p = Path('okazii.xml')
          if not p.exists() or p.stat().st_size < 1000000:
              raise SystemExit('Feed download failed or file is too small')

          tree = ET.parse(p)
          root = tree.getroot()

          for elem in root.iter():
              if isinstance(elem.tag, str):
                  elem.tag = elem.tag.upper()

          if root.tag != 'OKAZII':
              raise SystemExit(f'Unexpected root tag after normalization: {root.tag}')

          auctions = root.findall('AUCTION')
          if not auctions:
              raise SystemExit('No AUCTION elements found')

          removed_zero_stock = 0
          for auction in list(auctions):
              amount_node = auction.find('AMOUNT')
              raw_amount = (amount_node.text or '').strip() if amount_node is not None else ''
              try:
                  amount = Decimal(raw_amount.replace(',', '.'))
              except (InvalidOperation, AttributeError):
                  raise SystemExit(f'Invalid AMOUNT value: {raw_amount!r}')
              if amount <= 0:
                  root.remove(auction)
                  removed_zero_stock += 1

          reported_duplicate_uids = {
              '675-1112657940',
              'SL65652',
              'SL90462',
              'SL64042',
              'SL70092',
              'SL90862',
              'SL69282',
              'SL90672',
          }
          removed_reported_duplicates = 0
          for auction in list(root.findall('AUCTION')):
              uid = (auction.findtext('UNIQUEID') or '').strip()
              if uid in reported_duplicate_uids:
                  root.remove(auction)
                  removed_reported_duplicates += 1

          seen_product_keys = {}
          removed_cross_category_duplicates = 0
          for auction in list(root.findall('AUCTION')):
              sku = (auction.findtext('SKU') or '').strip().casefold()
              gtin = (auction.findtext('GTIN') or '').strip()
              category = (auction.findtext('CATEGORY') or '').strip()
              if not sku or not gtin:
                  continue
              key = (sku, gtin)
              previous_category = seen_product_keys.get(key)
              if previous_category is None:
                  seen_product_keys[key] = category
                  continue
              if previous_category != category:
                  root.remove(auction)
                  removed_cross_category_duplicates += 1

          auctions = root.findall('AUCTION')
          if not auctions:
              raise SystemExit('No publishable AUCTION elements remain')

          required = ('UNIQUEID', 'TITLE', 'CATEGORY', 'DESCRIPTION', 'CURRENCY', 'PRICE', 'AMOUNT')
          seen_unique_ids = set()
          for idx, auction in enumerate(auctions, 1):
              missing = [tag for tag in required if auction.find(tag) is None]
              photos = auction.find('PHOTOS')
              if photos is None or photos.find('URL') is None:
                  missing.append('PHOTOS/URL')
              if missing:
                  raise SystemExit(f'AUCTION #{idx} missing required tags: {", ".join(missing)}')

              uid = (auction.findtext('UNIQUEID') or '').strip()
              if not uid:
                  raise SystemExit(f'AUCTION #{idx} has empty UNIQUEID')
              if uid in seen_unique_ids:
                  raise SystemExit(f'Duplicate UNIQUEID in feed: {uid}')
              if uid in reported_duplicate_uids:
                  raise SystemExit(f'Reported duplicate UNIQUEID still present: {uid}')
              seen_unique_ids.add(uid)

              raw_amount = (auction.findtext('AMOUNT') or '').strip()
              try:
                  amount = Decimal(raw_amount.replace(',', '.'))
              except InvalidOperation:
                  raise SystemExit(f'AUCTION #{idx} has invalid AMOUNT: {raw_amount!r}')
              if amount <= 0:
                  raise SystemExit(f'AUCTION #{idx} still has non-positive AMOUNT: {raw_amount!r}')

          try:
              ET.indent(tree, space='  ')
          except AttributeError:
              pass
          tree.write(p, encoding='utf-8', xml_declaration=True)
          ET.parse(p)
          print(
              f'validated_auctions={len(auctions)} '
              f'removed_zero_stock={removed_zero_stock} '
              f'removed_reported_duplicates={removed_reported_duplicates} '
              f'removed_cross_category_duplicates={removed_cross_category_duplicates} '
              f'size_bytes={p.stat().st_size}'
          )
          PY

      - name: Block unapproved price drops over 15 percent
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation, ROUND_HALF_UP
          from pathlib import Path

          old_path = Path('previous_public_okazii.xml')
          new_path = Path('okazii.xml')
          approvals_path = Path('price-drop-approvals.json')
          if not old_path.is_file() or not new_path.is_file():
              raise SystemExit('Price guard cannot compare old and new feed')

          limit_pct = Decimal(os.environ.get('MAX_PRICE_DROP_PCT', '15'))
          limit_ratio = limit_pct / Decimal('100')

          def money(value):
              try:
                  return Decimal(str(value).strip().replace(',', '.')).quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)
              except (InvalidOperation, AttributeError):
                  return None

          def offers(path):
              root = ET.parse(path).getroot()
              result = {}
              for node in root.iter():
                  if not isinstance(node.tag, str) or node.tag.split('}', 1)[-1].upper() != 'AUCTION':
                      continue
                  fields = {}
                  for child in list(node):
                      if isinstance(child.tag, str):
                          fields[child.tag.split('}', 1)[-1].upper()] = (child.text or '').strip()
                  uid = fields.get('UNIQUEID', '')
                  price = money(fields.get('PRICE', ''))
                  if uid and price is not None:
                      result[uid] = {
                          'price': price,
                          'sku': fields.get('SKU', ''),
                          'title': fields.get('TITLE', ''),
                      }
              return result

          old = offers(old_path)
          new = offers(new_path)

          approvals = set()
          if approvals_path.is_file():
              payload = json.loads(approvals_path.read_text(encoding='utf-8'))
              for item in payload.get('approvals', []):
                  uid = str(item.get('unique_id', '')).strip()
                  from_price = money(item.get('from_price', ''))
                  to_price = money(item.get('to_price', ''))
                  if uid and from_price is not None and to_price is not None:
                      approvals.add((uid, from_price, to_price))

          blocked = []
          approved = []
          for uid, current in new.items():
              previous = old.get(uid)
              if not previous:
                  continue
              old_price = previous['price']
              new_price = current['price']
              if old_price <= 0 or new_price >= old_price:
                  continue
              drop_ratio = (old_price - new_price) / old_price
              if drop_ratio <= limit_ratio:
                  continue
              entry = (uid, old_price, new_price)
              row = {
                  'unique_id': uid,
                  'sku': current['sku'],
                  'title': current['title'],
                  'from_price': f'{old_price:.2f}',
                  'to_price': f'{new_price:.2f}',
                  'drop_pct': f'{(drop_ratio * 100):.2f}',
              }
              if entry in approvals:
                  approved.append(row)
              else:
                  blocked.append(row)

          if approved:
              print('PRICE_DROP_APPROVED_BEGIN')
              print(json.dumps(approved, ensure_ascii=False, indent=2))
              print('PRICE_DROP_APPROVED_END')

          if blocked:
              print('PRICE_DROP_BLOCKED_BEGIN')
              print(json.dumps(blocked, ensure_ascii=False, indent=2))
              print('PRICE_DROP_BLOCKED_END')
              print(
                  f'Blocked {len(blocked)} price decrease(s) above {limit_pct}%.'
                  ' Public feed was NOT changed. User approval is required.'
              )
              raise SystemExit(42)

          print(f'Price-drop guard passed: no unapproved decrease above {limit_pct}%.')
          PY

      - name: Commit feed if changed
        run: |
          set -euo pipefail
          git config user.name "okazii-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add okazii.xml
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Update Okazii feed"
            git push
          fi

      - name: Purge jsDelivr branch cache
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://purge.jsdelivr.net/gh/julianmuzykarz-collab/okazii-public-feed@main/okazii.xml"
          echo
